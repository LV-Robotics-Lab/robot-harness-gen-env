# 类目典型真实尺寸表（size_policy 方案 C 的数据源）
#
# size_m = 该类目物体在真实世界的典型最长边（米）。这是**环境无关的事实**，
# 与桌子无关——"放不放得上桌"由各视图的包络策略自行裁决（s9 的
# tabletop 视图：≤0.42 原样 / ≤0.84 压包络打 capped 标 / 更大则该视图拒绝）。
#
# confidence: high=日常物件无歧义; medium=尺寸方差大取常见值; low=类目名
# 本身有歧义（多为标志牌/面板类词），解释写在 note——低置信项请抽查。
#
# 作用域：只约束**采购入库**的外部/生成资产。上游原生资产（001-131）保留
# RoboTwin 作者人工定标，不受此表影响。
# 起草：2026-08-15（LLM 起草，待人工抽查低置信项）
schema: envgen.category_sizes.v1
default_unknown_m: 0.25   # 表里没有的新类目仍用旧缺省，并要求补表
views:
  tabletop:            # 当前唯一消费环境（RoboTwin 0.70x0.50m 工作区）
    fit_max_m: 0.42    # 典型尺寸 <= 此值: 按真实尺寸入库
    cap_to_m: 0.42     # 温和超限: 压到此值并打 capped 标记
    refuse_over_m: 0.84  # 超过此值: 本视图诚实拒绝(资产真实尺寸留待其它环境)
