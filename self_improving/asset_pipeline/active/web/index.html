<!doctype html>
<html lang="zh-CN">
<head>
<title>Pipeline Studio · env-gen-dev</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20100%20100'%3E%3Ctext%20y='.9em'%20font-size='90'%3E%F0%9F%8F%AD%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f6;
    --panel: #ffffff;
    --border: #dfe3e0;
    --text: #1c211f;
    --text-dim: #5c655f;
    --mono-bg: #eef0ee;
    --accent: #1F7A63;
    --accent-fg: #ffffff;
    --pending: #c7cbc8;
    --active: #d99a2b;
    --done: #1F7A63;
    --rejected: #c0392b;
    --card-shadow: 0 1px 2px rgba(20, 30, 25, 0.06);
    --log-bg: #14181a;
    --log-fg: #c9d4cd;
    /* dataviz 校验通过的分类色对 + 中性量级条色 */
    --cat-a: #0E8A5F;
    --cat-b: #5B5FC7;
    --bar-neutral: #566873;
  }
  :root[data-theme="dark"] {
    --bg: #141715;
    --panel: #1b1f1c;
    --border: #2c3330;
    --text: #e7ebe8;
    --text-dim: #9aa39d;
    --mono-bg: #10141a;
    --accent: #58B394;
    --accent-fg: #0c1210;
    --pending: #3a423e;
    --active: #e0b158;
    --done: #58B394;
    --rejected: #e07a6a;
    --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
    --log-bg: #0d1112;
    --log-fg: #b7c4bc;
    --cat-a: #2E9A75;
    --cat-b: #6B6FD6;
    --bar-neutral: #7E8C96;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141715;
      --panel: #1b1f1c;
      --border: #2c3330;
      --text: #e7ebe8;
      --text-dim: #9aa39d;
      --mono-bg: #10141a;
      --accent: #58B394;
      --accent-fg: #0c1210;
      --pending: #3a423e;
      --active: #e0b158;
      --done: #58B394;
      --rejected: #e07a6a;
      --card-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
      --log-bg: #0d1112;
      --log-fg: #b7c4bc;
      --cat-a: #2E9A75;
      --cat-b: #6B6FD6;
      --bar-neutral: #7E8C96;
    }
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.55;
  }
  code, .mono, .path { font-family: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; font-size: 12.5px; }

  /* ---------- header / form ---------- */
  header {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 12px 22px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  header .brand h1 { margin: 0; font-size: 16.5px; font-weight: 700; letter-spacing: .01em; }
  header .brand .sub { color: var(--text-dim); font-size: 11.5px; margin-top: 1px; }
  #form { display: flex; align-items: flex-end; gap: 12px; flex: 1 1 auto; flex-wrap: wrap; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--text-dim); font-weight: 600; letter-spacing: .02em; }
  .field input {
    background: var(--mono-bg); border: 1px solid var(--border); border-radius: 7px;
    padding: 7px 10px; color: var(--text); font-size: 13px;
  }
  .field input:focus { outline: 2px solid color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: 0; }
  .field.grow { flex: 1 1 300px; min-width: 220px; }
  #seed { width: 90px; }
  #excludeCategory { width: 150px; }
  #runBtn {
    background: var(--accent); color: var(--accent-fg); border: none; border-radius: 7px;
    padding: 8px 20px; font-size: 13px; font-weight: 650; cursor: pointer; height: 34px;
  }
  #runBtn:disabled { opacity: .45; cursor: not-allowed; }
  #runBtn:hover:not(:disabled) { filter: brightness(1.07); }

  /* ---------- layout ---------- */
  .layout { display: flex; align-items: stretch; min-height: calc(100vh - 61px); }
  aside {
    width: 264px; flex: 0 0 264px;
    border-right: 1px solid var(--border);
    background: var(--panel);
    overflow-y: auto; max-height: calc(100vh - 61px); position: sticky; top: 0;
  }
  aside h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .05em;
    color: var(--text-dim); margin: 16px 14px 6px;
  }
  .run-item { padding: 7px 14px; cursor: pointer; border-left: 3px solid transparent; }
  .run-item:hover { background: var(--mono-bg); }
  .run-item.active { border-left-color: var(--accent); background: var(--mono-bg); }
  .run-item .label { font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .run-item .meta { color: var(--text-dim); font-size: 11px; display: flex; gap: 6px; align-items: center; }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: 0 0 auto; }
  .dot.scene { background: var(--done); }
  .dot.blocker, .dot.failed { background: var(--rejected); }
  .dot.running { background: var(--active); animation: pulse 1.4s ease-in-out infinite; }
  .dot.evidence, .dot.none { background: var(--pending); }
  .spin {
    width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto;
    border: 2px solid var(--active); border-top-color: transparent;
    animation: rot 0.9s linear infinite; display: inline-block;
  }
  @keyframes rot { to { transform: rotate(360deg); } }

  main { flex: 1 1 auto; padding: 16px 22px 40px; min-width: 0; }

  .empty { color: var(--text-dim); font-size: 12.5px; padding: 14px 0; }
  .hint-chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .hint-chip {
    border: 1px dashed var(--border); border-radius: 14px; padding: 4px 12px;
    font-size: 12px; color: var(--text-dim); cursor: pointer; background: var(--panel);
  }
  .hint-chip:hover { color: var(--accent); border-color: var(--accent); }

  /* ---------- view tabs ---------- */
  #viewTabs {
    display: flex; gap: 2px; background: var(--mono-bg); border: 1px solid var(--border);
    border-radius: 9px; padding: 2px; margin-left: 4px;
  }
  .vtab {
    padding: 5px 14px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
    color: var(--text-dim); cursor: pointer; user-select: none; white-space: nowrap;
  }
  .vtab.active { background: var(--panel); color: var(--text); box-shadow: var(--card-shadow); }
  .vtab:hover:not(.active) { color: var(--text); }

  /* ---------- library view ---------- */
  .libcard {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--card-shadow); padding: 14px 18px 16px; margin-bottom: 12px;
  }
  .libcard h3 { margin: 0 0 4px; font-size: 14px; }
  .libcard .sub { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; }
  #libHead { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
  #libHead h2 { margin: 0; font-size: 16px; }
  #libHead .meta { color: var(--text-dim); font-size: 12px; }
  #libRefresh {
    margin-left: auto; font-size: 12px; color: var(--accent); cursor: pointer;
    border: 1px solid var(--border); border-radius: 7px; padding: 4px 12px; background: var(--panel);
  }
  #libRefresh:hover { border-color: var(--accent); }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .kpi {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--card-shadow); padding: 12px 16px 10px;
  }
  .kpi .num { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .kpi .lbl { font-size: 11.5px; color: var(--text-dim); font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .kpi .ctx { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  .kpi .lbl .kdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }

  .prop { display: flex; height: 14px; border-radius: 4px; overflow: hidden; background: var(--mono-bg); }
  .prop .seg { height: 100%; }
  .prop .seg + .seg { margin-left: 2px; }
  .prop-lbl { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-dim); margin-top: 5px; }

  .hbar-row {
    display: grid; grid-template-columns: 150px 1fr 150px; gap: 10px; align-items: center;
    padding: 4px 6px; border-radius: 7px; cursor: pointer; font-size: 12.5px;
  }
  .hbar-row:hover { background: var(--mono-bg); }
  .hbar-row .hl { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hbar-track { display: block; height: 14px; border-radius: 4px; background: var(--mono-bg); overflow: hidden; }
  .hbar-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--bar-neutral); }
  .hbar-val { color: var(--text-dim); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }
  .hbar-val b { color: var(--text); }

  .legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 8px; font-size: 12px; }
  .legend .li { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .legend .li:hover { color: var(--accent); }
  .ldot { width: 9px; height: 9px; border-radius: 3px; display: inline-block; }

  .tier-row { display: flex; gap: 10px; overflow-x: auto; margin-top: 10px; }
  .tier-card {
    flex: 1 1 0; min-width: 150px; border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; background: var(--mono-bg);
  }
  .tier-card .tn {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: var(--accent-fg);
    font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 6px;
  }
  .tier-card .tname { font-size: 12.5px; font-weight: 650; font-family: Menlo, Consolas, monospace; }
  .tier-card .tscale { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; }
  .tier-card.off { opacity: .5; }

  .warnline {
    display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--active);
    font-weight: 600; margin-top: 8px;
  }
  .cat-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .cat-chip {
    border: 1px solid var(--border); border-radius: 12px; padding: 3px 10px; font-size: 11.5px;
    cursor: pointer; background: var(--mono-bg);
  }
  .cat-chip:hover { border-color: var(--accent); color: var(--accent); }
  .cat-chip b { font-weight: 700; }

  .cov-row { display: grid; grid-template-columns: 90px 1fr 96px; gap: 10px; align-items: center; font-size: 12.5px; padding: 4px 0; }
  .cov-track { display: block; height: 10px; border-radius: 4px; background: var(--mono-bg); overflow: hidden; }
  .cov-fill { display: block; height: 100%; border-radius: 0 4px 4px 0; background: var(--accent); }
  .cov-val { color: var(--text-dim); font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; }

  .imp-strip { display: flex; gap: 10px; overflow-x: auto; padding: 4px 0; }
  .imp-card { flex: 0 0 auto; width: 108px; cursor: pointer; }
  .imp-card img, .imp-card .phld {
    width: 108px; height: 108px; border-radius: 8px; border: 1px solid var(--border);
    object-fit: cover; background: var(--mono-bg); display: block;
  }
  .imp-card .iid { font-size: 11px; font-family: Menlo, Consolas, monospace; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imp-card .icat { font-size: 10.5px; color: var(--text-dim); }

  .drill-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; padding: 14px 16px; }
  .drill-cell { font-size: 11px; }
  .drill-cell img, .drill-cell .phld {
    width: 100%; aspect-ratio: 1; border-radius: 8px; border: 1px solid var(--border);
    object-fit: cover; background: var(--mono-bg); display: block; cursor: zoom-in;
  }
  .phld { display: flex !important; align-items: center; justify-content: center; color: var(--pending); }
  .drill-cell .did { font-family: Menlo, Consolas, monospace; margin-top: 3px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .drill-cell .dmeta { color: var(--text-dim); font-size: 10.5px; display: flex; gap: 5px; align-items: center; }

  /* ---------- run header card ---------- */
  #runHeader { margin-bottom: 12px; }
  .runcard {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--card-shadow); padding: 14px 18px;
    display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap;
  }
  .runcard .prompt { font-size: 17px; font-weight: 650; flex: 1 1 340px; min-width: 240px; }
  .runcard .kv { color: var(--text-dim); font-size: 12px; margin-top: 5px; display: flex; gap: 14px; flex-wrap: wrap; }
  .runcard .kv b { color: var(--text); font-weight: 600; }
  .badge {
    border-radius: 8px; padding: 5px 12px; font-size: 12.5px; font-weight: 650;
    border: 1px solid var(--border); white-space: nowrap; align-self: center;
  }
  .badge.scene { color: var(--done); border-color: var(--done); }
  .badge.blocker, .badge.failed { color: var(--rejected); border-color: var(--rejected); }
  .badge.running { color: var(--active); border-color: var(--active); animation: pulse 1.4s ease-in-out infinite; }
  .badge.hist { color: var(--text-dim); }
  .elapsed { text-align: right; align-self: center; }
  .elapsed .big { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .elapsed .lbl { color: var(--text-dim); font-size: 11px; }

  /* ---------- stepper ---------- */
  #stepper { margin-bottom: 12px; }
  .steps {
    display: flex; gap: 0; background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--card-shadow); overflow-x: auto; padding: 6px;
  }
  .step {
    flex: 1 1 0; min-width: 96px; cursor: pointer; border-radius: 8px;
    padding: 8px 10px 7px; text-align: center; position: relative; border: 1px solid transparent;
  }
  .step:hover { background: var(--mono-bg); }
  .step.sel { background: var(--mono-bg); border-color: var(--border); }
  .step .ic {
    width: 26px; height: 26px; border-radius: 50%; margin: 0 auto 4px;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 700; color: var(--panel); background: var(--pending);
  }
  .step.done .ic { background: var(--done); }
  .step.active .ic { background: var(--active); animation: pulse 1.4s ease-in-out infinite; }
  .step.failed .ic, .step.blocked .ic { background: var(--rejected); }
  .step.skipped .ic { background: transparent; color: var(--pending); border: 1.5px dashed var(--pending); }
  .step .nm { font-size: 12px; font-weight: 600; white-space: nowrap; }
  .step.skipped .nm, .step.pending .nm { color: var(--text-dim); font-weight: 500; }
  .step .du { font-size: 11px; color: var(--text-dim); font-variant-numeric: tabular-nums; min-height: 16px; }
  .step.active .du { color: var(--active); font-weight: 650; }
  .step:not(:last-child)::after {
    content: ""; position: absolute; right: -1px; top: 22%; height: 56%;
    border-right: 1px solid var(--border);
  }
  .follow-row { display: flex; justify-content: flex-end; margin-top: 5px; }
  .follow-toggle { font-size: 11.5px; color: var(--text-dim); cursor: pointer; user-select: none; display: none; align-items: center; gap: 5px; }
  .follow-toggle.show { display: inline-flex; }
  .follow-toggle input { accent-color: var(--accent); }
  @media (prefers-reduced-motion: reduce) { .step.active .ic, .dot.running, .badge.running, .spin { animation: none; } }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .45; } }

  /* ---------- stage panel ---------- */
  #stagePanel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--card-shadow); padding: 14px 18px 16px; margin-bottom: 12px; min-height: 120px;
  }
  #stagePanel h3 { margin: 0 0 10px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
  #stagePanel h3 .st-tag { font-size: 11.5px; font-weight: 600; border-radius: 10px; padding: 2px 10px; border: 1px solid var(--border); color: var(--text-dim); }
  #stagePanel h3 .st-tag.done { color: var(--done); border-color: var(--done); }
  #stagePanel h3 .st-tag.active { color: var(--active); border-color: var(--active); }
  #stagePanel h3 .st-tag.failed, #stagePanel h3 .st-tag.blocked { color: var(--rejected); border-color: var(--rejected); }

  table { border-collapse: collapse; width: 100%; font-size: 12.5px; margin: 6px 0; }
  th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--text-dim); font-weight: 600; }
  td.ok { color: var(--done); font-weight: 600; }
  td.bad { color: var(--rejected); font-weight: 600; }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
  .chip { border-radius: 12px; padding: 3px 10px; font-size: 11.5px; border: 1px solid var(--border); background: var(--mono-bg); }
  .chip.selected { border-color: var(--done); color: var(--done); }
  .chip.rejected { border-color: var(--rejected); color: var(--rejected); }

  .gallery { display: flex; flex-wrap: wrap; gap: 12px; margin: 8px 0; }
  .fig { display: flex; flex-direction: column; gap: 4px; }
  .fig img {
    width: 148px; height: 148px; object-fit: cover; border-radius: 8px;
    border: 1px solid var(--border); cursor: zoom-in; display: block;
  }
  .fig .cap { font-size: 11px; color: var(--text-dim); text-align: center; max-width: 148px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  video.main { max-width: min(640px, 100%); border-radius: 10px; border: 1px solid var(--border); display: block; margin: 8px 0; }

  details.raw { margin-top: 10px; }
  details.raw summary { cursor: pointer; color: var(--text-dim); font-size: 11.5px; }
  details.raw pre { background: var(--mono-bg); padding: 8px; border-radius: 6px; overflow: auto; max-height: 300px; font-size: 11.5px; }

  .blocker-card { border: 1px solid var(--rejected); border-radius: 10px; padding: 10px 14px; margin: 8px 0; }
  .filelinks { display: flex; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
  .filelink {
    font-size: 12px; border: 1px solid var(--border); border-radius: 8px; padding: 4px 10px;
    cursor: pointer; background: var(--mono-bg); color: var(--text);
    font-family: "SF Mono", Menlo, Consolas, monospace;
  }
  .filelink:hover { border-color: var(--accent); color: var(--accent); }
  .loglink { font-size: 12px; color: var(--accent); cursor: pointer; text-decoration: underline; }

  /* ---------- files panel ---------- */
  #filesWrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--card-shadow); margin-bottom: 12px; overflow: hidden;
  }
  #filesWrap summary { cursor: pointer; font-weight: 650; font-size: 13px; padding: 11px 18px; list-style-position: inside; }
  #filesPanel { padding: 0 18px 12px; }
  .fgroup { margin: 6px 0 10px; }
  .fgroup .gname { font-size: 11.5px; color: var(--text-dim); font-weight: 650; margin-bottom: 3px; }
  .frow {
    display: flex; gap: 10px; align-items: baseline; padding: 2.5px 6px; border-radius: 6px;
    cursor: pointer; font-size: 12.5px;
  }
  .frow:hover { background: var(--mono-bg); }
  .frow .fp { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; }
  .frow .fs { color: var(--text-dim); font-size: 11px; margin-left: auto; white-space: nowrap; }

  /* ---------- log panel ---------- */
  #logWrap {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: var(--card-shadow); overflow: hidden;
  }
  #logWrap .loghead {
    display: flex; align-items: center; gap: 12px; padding: 10px 18px; cursor: pointer;
    font-weight: 650; font-size: 13px; user-select: none;
  }
  #logWrap .loghead .cnt { color: var(--text-dim); font-weight: 500; font-size: 11.5px; }
  #logWrap .loghead .lfollow { margin-left: auto; font-size: 11.5px; color: var(--text-dim); font-weight: 500; display: flex; gap: 5px; align-items: center; }
  #logWrap .loghead .lfollow input { accent-color: var(--accent); }
  #logBody {
    display: none; background: var(--log-bg); color: var(--log-fg);
    max-height: 44vh; overflow: auto; padding: 8px 0; font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px; line-height: 1.5;
  }
  #logWrap.open #logBody { display: block; }
  .ll { padding: 0 14px; white-space: pre-wrap; word-break: break-all; }
  .ll.err { color: #e07a6a; }
  .ll.ok { color: #6fbf9b; }
  .ll.sep { color: #e0b158; font-weight: 700; border-top: 1px solid rgba(255,255,255,.09); margin-top: 4px; padding-top: 4px; }
  .ll .rep { background: rgba(224,177,88,.18); color: #e0b158; border-radius: 8px; padding: 0 7px; margin-left: 8px; font-size: 10.5px; }

  /* ---------- toast / lightbox / modal ---------- */
  #toast { position: fixed; bottom: 16px; right: 16px; z-index: 60; display: flex; flex-direction: column; gap: 6px; }
  .toast-line { background: var(--rejected); color: #fff; padding: 8px 14px; border-radius: 6px; font-size: 12.5px; box-shadow: var(--card-shadow); }
  .lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; z-index: 100; flex-direction: column; gap: 10px; }
  .lightbox.open { display: flex; }
  .lightbox img { max-width: 92vw; max-height: 86vh; border-radius: 6px; }
  .lightbox .lb-cap { color: #ddd; font-size: 12.5px; font-family: Menlo, Consolas, monospace; }
  #modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; z-index: 90; }
  #modal.open { display: flex; }
  #modalBox {
    background: var(--panel); color: var(--text); border-radius: 12px; width: min(860px, 94vw);
    max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border);
  }
  #modalBox .mhead { display: flex; align-items: center; padding: 10px 16px; border-bottom: 1px solid var(--border); gap: 10px; }
  #modalBox .mhead .mt { font-family: Menlo, Consolas, monospace; font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #modalBox .mhead a { margin-left: auto; font-size: 12px; color: var(--accent); }
  #modalBox .mhead .x { cursor: pointer; color: var(--text-dim); font-size: 16px; padding: 0 4px; }
  #modalBody { overflow: auto; padding: 0; }
  #modalBody pre { margin: 0; padding: 14px 16px; font-size: 12px; font-family: "SF Mono", Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  #modalBody video { width: 100%; display: block; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <h1>Pipeline Studio</h1>
    <div class="sub">env-gen-dev · 资产自适应场景生成</div>
  </div>
  <nav id="viewTabs">
    <span class="vtab active" data-v="run">运行</span>
    <span class="vtab" data-v="library">资产库</span>
  </nav>
  <div id="form">
    <div class="field grow">
      <label for="prompt">提示词</label>
      <input type="text" id="prompt" placeholder="Place a red mug on the table.">
    </div>
    <div class="field">
      <label for="seed">seed</label>
      <input type="number" id="seed" value="42">
    </div>
    <div class="field">
      <label for="excludeCategory" title="为本次运行临时剔除该类别以触发真实引进；引进的资产会真实入库">演示缺口（可选）</label>
      <input type="text" id="excludeCategory" placeholder="如 bowl">
    </div>
    <button id="runBtn">运行</button>
  </div>
</header>

<div class="layout">
  <aside>
    <h2>本次会话</h2>
    <div id="webList"><div class="empty" style="padding:4px 14px;">暂无</div></div>
    <h2>历史记录</h2>
    <div id="historyList"><div class="empty" style="padding:4px 14px;">加载中…</div></div>
  </aside>
  <main>
    <div id="content">
      <div class="empty" id="welcome">
        <div style="font-size:15px;font-weight:650;color:var(--text);">提交一个提示词，实时观察 7 个阶段的生成过程。</div>
        <div style="margin-top:4px;">或从左侧选择一条运行记录查看详情。试试：</div>
        <div class="hint-chips">
          <span class="hint-chip">Place a red mug on the table.</span>
          <span class="hint-chip">put a duck on the table</span>
          <span class="hint-chip">place a laptop on the table</span>
        </div>
        <div style="margin-top:16px;">
          <span class="hint-chip" id="libEntry" style="border-style:solid;">📦 资产库总览 — 量级 / 可用性 / 来源统计</span>
        </div>
      </div>
      <div id="libView" style="display:none;"></div>
      <div id="runView" style="display:none;">
        <div id="runHeader"></div>
        <div id="stepper"></div>
        <div id="stagePanel"></div>
        <details id="filesWrap"><summary>产物文件 <span id="filesCnt" class="cnt" style="color:var(--text-dim);font-weight:500;font-size:11.5px;"></span></summary><div id="filesPanel"></div></details>
        <div id="logWrap">
          <div class="loghead" id="logHead">
            <span id="logArrow">▸</span> 运行日志 <span class="cnt" id="logCnt"></span>
            <label class="lfollow" onclick="event.stopPropagation()"><input type="checkbox" id="logFollowCb" checked> 跟随</label>
          </div>
          <div id="logBody"></div>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>
<div class="lightbox" id="lightbox"><img id="lightboxImg"><div class="lb-cap" id="lightboxCap"></div></div>
<div id="modal"><div id="modalBox"><div class="mhead"><span class="mt" id="modalTitle"></span><a id="modalRaw" target="_blank">原始文件</a><span class="x" id="modalX">✕</span></div><div id="modalBody"></div></div></div>

<script>
"use strict";

const STAGE_SHORT = {1:"覆盖检查",2:"缺口引进",3:"下载转换",4:"物理质检",5:"catalog 重建",6:"场景生成",7:"回放渲染"};
const STAGE_ICON = {done:"✔", active:"⟳", skipped:"⏭", failed:"✕", blocked:"⛔", pending:""};
const VIEW_LABELS = {
  observer_start: "观察 · 起始", observer_mid: "观察 · 中段", observer_end: "观察 · 结束",
  preview_head: "俯视预览", preview_segmentation: "分割图",
  preview_world_left: "世界 · 左", preview_world_right: "世界 · 右",
  observer_runtime: "回放视频",
};

const S = {
  group: null, id: null, gen: 0,
  status: null, statusAt: 0,
  stageSel: null, followStage: true,
  logOffset: 0, logPartial: "", logLastNorm: null, logLastEl: null, logRepeat: 1,
  files: null, rtReport: undefined,
  runsData: null, pollN: 0,
  lbList: [], lbIdx: 0,
};

// ---------- utils ----------
function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function toast(msg) {
  const t = document.getElementById("toast");
  const el = document.createElement("div");
  el.className = "toast-line"; el.textContent = msg;
  t.appendChild(el); setTimeout(() => el.remove(), 5000);
}
async function api(path, opts) {
  const res = await fetch(path, opts);
  if (!res.ok) {
    let body = {};
    try { body = await res.json(); } catch (e) {}
    const err = new Error(body.error || res.statusText);
    err.status = res.status; err.body = body;
    throw err;
  }
  return res.json();
}
function fileUrl(p) { return `/api/run/${S.group}/${S.id}/file?p=${encodeURIComponent(p)}`; }
function fmtDur(s) {
  if (s == null) return "";
  if (s < 1) return "<1s";
  s = Math.round(s);
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60), r = s % 60;
  if (m < 60) return m + "m" + String(r).padStart(2, "0") + "s";
  return Math.floor(m / 60) + "h" + String(m % 60).padStart(2, "0") + "m";
}
function fmtTime(epoch) {
  if (!epoch) return "—";
  const d = new Date(epoch * 1000);
  const p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
}
function relTime(epoch) {
  if (!epoch) return "";
  const diff = Date.now() / 1000 - epoch;
  if (diff < 90) return "刚刚";
  if (diff < 3600) return Math.round(diff / 60) + " 分钟前";
  if (diff < 86400) return Math.round(diff / 3600) + " 小时前";
  return Math.round(diff / 86400) + " 天前";
}
function fmtSize(n) {
  if (n == null) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function byteLen(s) { return new TextEncoder().encode(s).length; }
function setRegion(el, sigObj, htmlFn) {
  const sig = JSON.stringify(sigObj);
  if (el.dataset.sig === sig) return false;
  const open = [...el.querySelectorAll("details")].map(d => d.open);
  el.dataset.sig = sig;
  el.innerHTML = htmlFn();
  [...el.querySelectorAll("details")].forEach((d, i) => { if (open[i]) d.open = true; });
  return true;
}
function isLive(st) {
  return !!(st && st.state && (st.state.phase === "pipeline" || st.state.phase === "render"));
}
function startedTs(st) {
  const m = st && st.meta;
  if (m && m.started_at) return Date.parse(m.started_at) / 1000;
  const tl = (st && st.stage_timeline) || [];
  const known = tl.map(x => x.ended_at).filter(Boolean);
  return known.length ? Math.min(...known) : null;
}

// ---------- run list (sidebar) ----------
async function refreshRuns() {
  try {
    const data = await api("/api/runs");
    S.runsData = data;
    renderSidebar();
    renderRunBtn();
  } catch (e) { toast("加载运行列表失败: " + e.message); }
}
function outcomeDotClass(item, current) {
  if (item.id === current) return "running";
  if (item.outcome === "scene") return "scene";
  if (item.outcome === "blocker") return "blocker";
  if (item.outcome === "failed") return "failed";
  if (item.outcome === "evidence") return "evidence";
  return item.group === "web" ? "running" : "none";
}
function renderSidebar() {
  const d = S.runsData;
  if (!d) return;
  const cur = d.current;
  const webItems = [...d.web].sort((a, b) => (b.id === cur) - (a.id === cur) || b.mtime - a.mtime);
  renderList("webList", webItems, "web", cur);
  renderList("historyList", d.history, "history", cur);
}
function renderList(elId, items, group, current) {
  const el = document.getElementById(elId);
  setRegion(el, {items: items.map(i => [i.id, i.outcome, i.id === current]), sel: S.group === group ? S.id : null}, () => {
    if (!items || !items.length) return '<div class="empty" style="padding:4px 14px;">暂无</div>';
    return items.map(item => {
      const active = group === S.group && item.id === S.id;
      const running = item.id === current;
      const ic = running ? '<span class="spin"></span>' : `<span class="dot ${outcomeDotClass(item, current)}"></span>`;
      return `<div class="run-item ${active ? "active" : ""}" data-g="${group}" data-id="${escapeHtml(item.id)}">
        <div class="label" title="${escapeHtml(item.id)}">${escapeHtml(item.label || item.id)}</div>
        <div class="meta">${ic}<span>${running ? "运行中" : relTime(item.mtime)}</span></div>
      </div>`;
    }).join("");
  });
  el.querySelectorAll(".run-item").forEach(div => {
    div.onclick = () => loadRun(div.dataset.g, div.dataset.id);
  });
}

// ---------- load / poll ----------
async function loadRun(group, id) {
  S.group = group; S.id = id; S.gen++;
  S.status = null; S.stageSel = null; S.followStage = true;
  S.logOffset = 0; S.logPartial = ""; S.logLastNorm = null; S.logLastEl = null; S.logRepeat = 1;
  S.files = null; S.rtReport = undefined; S.pollN = 0;
  const lb = document.getElementById("logBody");
  lb.innerHTML = ""; delete lb.dataset.sig;
  ["runHeader", "stepper", "stagePanel", "filesPanel"].forEach(i => { delete document.getElementById(i).dataset.sig; });
  if (location.hash) location.hash = "";
  setView("run");
  renderSidebar();
  fetchFiles();
  await pollStatus();
}
async function pollStatus() {
  const gen = S.gen;
  let st;
  try {
    st = await api(`/api/run/${S.group}/${S.id}/status`);
  } catch (e) {
    if (gen !== S.gen) return;
    toast("状态加载失败: " + e.message);
    if (isLive(S.status)) setTimeout(() => { if (gen === S.gen) pollStatus(); }, 4000);
    return;
  }
  if (gen !== S.gen) return;
  S.status = st; S.statusAt = Date.now();
  if (S.stageSel == null) S.stageSel = defaultStage(st);
  if (S.followStage) {
    const act = (st.stage_timeline || []).find(x => x.status === "active");
    if (act) S.stageSel = act.n;
  }
  renderRunHeader(); renderStepper(); renderStagePanel(); renderTabTitle();
  fetchLogDelta(gen);
  const live = isLive(st);
  if (live) {
    S.pollN++;
    if (S.pollN % 5 === 0) fetchFiles();
    setTimeout(() => { if (gen === S.gen) pollStatus(); }, 1500);
  } else {
    fetchFiles();
  }
}
function defaultStage(st) {
  const tl = st.stage_timeline || [];
  const act = tl.find(x => x.status === "active");
  if (act) return act.n;
  const last = [...tl].reverse().find(x => ["done", "blocked", "failed"].includes(x.status));
  return last ? last.n : 1;
}

// ---------- run header ----------
function renderRunHeader() {
  const st = S.status;
  const el = document.getElementById("runHeader");
  const meta = st.meta || {};
  const state = st.state || {};
  const live = isLive(st);
  const tl = st.stage_timeline || [];
  let badge, bcls;
  if (live) {
    const act = tl.find(x => x.status === "active");
    badge = "⏳ 运行中 · " + (act ? STAGE_SHORT[act.n] : (state.phase === "render" ? "回放渲染" : "流水线"));
    bcls = "running";
  } else if (state.outcome === "scene") { badge = "✅ 场景生成成功"; bcls = "scene"; }
  else if (state.outcome === "blocker") {
    const hasSimilar = ((st.stages && st.stages.evidence && st.stages.evidence.categories) || [])
      .some(c => c.match && c.match.grade === "similar");
    badge = hasSimilar ? "⛔ 缺口阻塞 · 有相似资产" : "⛔ 资产缺口阻塞";
    bcls = "blocker";
  }
  else if (state.outcome === "failed") { badge = `❌ 运行失败 (rc=${state.pipeline_rc})`; bcls = "failed"; }
  else if (tl[5] && tl[5].status === "blocked") { badge = "⛔ 资产缺口阻塞"; bcls = "blocker"; }
  else if (tl[5] && tl[5].status === "done") { badge = "历史 · 有场景"; bcls = "hist"; }
  else { badge = "历史记录"; bcls = "hist"; }

  const t0 = startedTs(st);
  const tEnd = state.finished_at ? Date.parse(state.finished_at) / 1000 : null;
  const total = (t0 && tEnd) ? tEnd - t0 : null;

  const cov = st.stages && st.stages.coverage;
  const promptShown = meta.prompt || (cov && cov.prompt) || S.id;
  setRegion(el, {p: promptShown, id: S.id, badge, total, live}, () => {
    const kv = [];
    if (meta.seed != null) kv.push(`seed <b>${escapeHtml(meta.seed)}</b>`);
    if (meta.exclude_category) kv.push(`演示缺口 <b>${escapeHtml(meta.exclude_category)}</b>`);
    if (promptShown !== S.id) kv.push(`<span class="mono">${escapeHtml(S.id)}</span>`);
    if (t0) kv.push(`开始 <b>${fmtTime(t0)}</b>`);
    const elapsedHtml = live
      ? `<div class="elapsed"><div class="big" id="elapsedVal">--:--</div><div class="lbl">已运行</div></div>`
      : (total != null ? `<div class="elapsed"><div class="big">${fmtDur(total)}</div><div class="lbl">总耗时</div></div>` : "");
    return `<div class="runcard">
      <div style="flex:1 1 340px;min-width:240px;">
        <div class="prompt">${escapeHtml(promptShown)}</div>
        <div class="kv">${kv.join("<span style='opacity:.4'>·</span>")}</div>
      </div>
      ${elapsedHtml}
      <div class="badge ${bcls}">${badge}</div>
    </div>`;
  });
  tickElapsed();
}
function liveElapsed() {
  const st = S.status;
  if (!st) return null;
  const t0 = startedTs(st);
  if (!t0 || !st.server_now) return null;
  return (st.server_now - t0) + (Date.now() - S.statusAt) / 1000;
}
function tickElapsed() {
  const v = document.getElementById("elapsedVal");
  if (!v || !isLive(S.status)) return;
  const e = liveElapsed();
  if (e != null) v.textContent = fmtDur(e);
  const act = (S.status.stage_timeline || []).find(x => x.status === "active");
  if (act) {
    const du = document.querySelector(`.step[data-n="${act.n}"] .du`);
    if (du && act.duration_s != null) du.textContent = fmtDur(act.duration_s + (Date.now() - S.statusAt) / 1000);
  }
}
setInterval(tickElapsed, 1000);

// ---------- stepper ----------
function renderStepper() {
  const st = S.status;
  const el = document.getElementById("stepper");
  const tl = st.stage_timeline || [];
  const live = isLive(st);
  setRegion(el, {tl: tl.map(x => [x.status, x.duration_s == null ? null : Math.round(x.duration_s)]), sel: S.stageSel, live, fs: S.followStage}, () => {
    const steps = tl.map(x => {
      const sel = x.n === S.stageSel ? " sel" : "";
      const ic = STAGE_ICON[x.status] || x.n;
      const du = x.status === "skipped" ? "跳过" : (x.duration_s != null ? fmtDur(x.duration_s) : "");
      return `<div class="step ${x.status}${sel}" data-n="${x.n}" title="${escapeHtml(x.detail || STAGE_SHORT[x.n])}">
        <div class="ic">${ic || x.n}</div>
        <div class="nm">${x.n}. ${STAGE_SHORT[x.n]}</div>
        <div class="du">${du}</div>
      </div>`;
    }).join("");
    const followRow = `<div class="follow-row"><label class="follow-toggle ${live ? "show" : ""}">
      <input type="checkbox" id="followCb" ${S.followStage ? "checked" : ""}> 跟随当前阶段</label></div>`;
    return `<div class="steps">${steps}</div>${followRow}`;
  });
  el.querySelectorAll(".step").forEach(d => {
    d.onclick = () => {
      S.stageSel = parseInt(d.dataset.n, 10);
      S.followStage = false;
      renderStepper(); renderStagePanel();
    };
  });
  const cb = el.querySelector("#followCb");
  if (cb) cb.onchange = () => {
    S.followStage = cb.checked;
    if (cb.checked) { const act = (S.status.stage_timeline || []).find(x => x.status === "active"); if (act) S.stageSel = act.n; }
    renderStepper(); renderStagePanel();
  };
}

// ---------- stage panel ----------
function rawDetails(label, obj) {
  if (!obj) return "";
  return `<details class="raw"><summary>${escapeHtml(label)}</summary><pre>${escapeHtml(JSON.stringify(obj, null, 2))}</pre></details>`;
}
function figImg(p, cap) {
  const url = fileUrl(p);
  return `<div class="fig"><img src="${url}" data-full="${url}" data-cap="${escapeHtml(cap || p)}" loading="lazy">
    <div class="cap" title="${escapeHtml(p)}">${escapeHtml(cap || p.split("/").pop())}</div></div>`;
}
function viewLabelFor(p) {
  const base = p.split("/").pop().replace(/\.(png|jpe?g|mp4)$/i, "");
  return VIEW_LABELS[base] || base;
}
function stTag(x) {
  const zh = {done: "完成", active: "进行中", skipped: "跳过", failed: "失败", blocked: "阻塞", pending: "等待"};
  return `<span class="st-tag ${x.status}">${zh[x.status] || x.status}${x.duration_s != null && x.status === "done" ? " · " + fmtDur(x.duration_s) : ""}</span>`;
}
function renderStagePanel() {
  const st = S.status;
  const el = document.getElementById("stagePanel");
  const n = S.stageSel || 1;
  const tl = (st.stage_timeline || [])[n - 1] || {status: "pending"};
  const stages = st.stages || {};
  const bodies = {1: stage1, 2: stage2, 3: stage3, 4: stage4, 5: stage5, 6: stage6, 7: stage7};
  setRegion(el, {n, tl: [tl.status, tl.detail, Math.round(tl.duration_s || 0)], sig: stageSig(n, st), rt: S.rtReport && S.rtReport.status}, () => {
    return `<h3>${n}. ${STAGE_SHORT[n]} ${stTag(tl)}</h3>` + bodies[n](st, stages, tl);
  });
  el.querySelectorAll("img[data-full]").forEach(img => {
    img.onclick = () => openLightbox(img);
  });
  el.querySelectorAll(".filelink").forEach(a => {
    a.onclick = () => openFilePreview(a.dataset.p);
  });
  el.querySelectorAll(".loglink").forEach(a => {
    a.onclick = () => { openLog(); };
  });
}
function stageSig(n, st) {
  const stages = st.stages || {};
  switch (n) {
    case 1: return stages.coverage;
    case 2: return stages.evidence;
    case 3: return (stages.shots || []).length;
    case 4: return stages.shots;
    case 5: return st.meta && st.meta.exclude_category;
    case 6: return [stages.scene, stages.blocker];
    case 7: return stages.render;
  }
}
function stage1(st, stages) {
  const objs = (stages.coverage && stages.coverage.objects) || [];
  if (!objs.length) return '<div class="empty">尚无数据 — 覆盖检查完成后此处显示需求对象与命中的资产。</div>';
  return `<table><thead><tr><th>object_id</th><th>category</th><th>status</th><th>asset_id</th><th>score</th></tr></thead><tbody>
    ${objs.map(o => `<tr><td class="mono">${escapeHtml(o.object_id)}</td><td>${escapeHtml(o.category)}</td>
      <td class="${o.status === "covered" ? "ok" : "bad"}">${escapeHtml(o.status)}</td>
      <td class="mono">${escapeHtml(o.asset_id ?? "")}</td><td>${escapeHtml(o.score ?? "")}</td></tr>`).join("")}
  </tbody></table>` + rawDetails("coverage_report.json 原始数据", stages.coverage);
}
function candRowHtml(c) {
  const a = c.asset || {};
  const gaps = (c.unmet || []).map(u => {
    const attr = u.attr === "color" ? "颜色" : u.attr === "material" ? "材质" : u.attr;
    return u.kind === "unverified" ? `${attr}?` : `${attr}✗`;
  }).join(" ");
  return `<div style="display:flex;gap:8px;align-items:center;padding:3px 0;font-size:11.5px;">
    <img src="/api/library/thumb/${encodeURIComponent(a.asset_id || "")}"
         style="width:28px;height:28px;border-radius:6px;border:1px solid var(--border);object-fit:cover;"
         onerror="this.style.display='none'">

  if (!nearBottom && logFollowCb.checked) logFollowCb.checked = false;
  else if (nearBottom && !logFollowCb.checked) logFollowCb.checked = true;

function scrollLogBottom() { logBodyEl.scrollTop = logBodyEl.scrollHeight; }
async function fetchLogDelta(gen) {
  for (let i = 0; i < 8; i++) {
    let r;
    try {
      r = await api(`/api/run/${S.group}/${S.id}/log?offset=${S.logOffset}`);
    } catch (e) { return; }
    if (gen !== S.gen) return;
    if (r.chunk) {
      S.logOffset = r.offset + byteLen(r.chunk);
      appendLogLines(r.chunk, !r.more);
    } else {
      S.logOffset = r.size;
    }
    document.getElementById("logCnt").textContent = r.size ? fmtSize(r.size) : "";
    if (!r.size && !logBodyEl.children.length) {
      logBodyEl.innerHTML = '<div class="ll" id="logEmpty" style="color:var(--text-dim);">（无日志）</div>';
    }
    if (!r.more) break;
  }
}
function normLine(l) { return l.replace(/^\[[^\]]*\]\s*/, "").trim(); }
function logLineClass(l) {
  if (/^=== stage: /.test(l.trim())) return "sep";
  if (/\bpass\b/i.test(l)) return "ok";
  if (/error|fail|traceback|exception/i.test(l)) return "err";
  return "";
}
function appendLogLines(chunk, flushPartial) {
  const ph = document.getElementById("logEmpty");
  if (ph) ph.remove();
  let text = S.logPartial + chunk;
  const lines = text.split("\n");
  S.logPartial = flushPartial ? "" : lines.pop();
  if (flushPartial && lines.length && lines[lines.length - 1] === "") lines.pop();
  const frag = document.createDocumentFragment();
  for (const line of lines) {
    const norm = normLine(line);
    if (norm && norm === S.logLastNorm) {
      S.logRepeat++;
      if (S.logLastEl) {
        let rep = S.logLastEl.querySelector(".rep");
        if (!rep) { rep = document.createElement("span"); rep.className = "rep"; S.logLastEl.appendChild(rep); }
        rep.textContent = "×" + S.logRepeat;
      }
      continue;
    }
    S.logLastNorm = norm; S.logRepeat = 1;
    const div = document.createElement("div");
    div.className = "ll " + logLineClass(line);
    div.textContent = line;
    const m = line.trim().match(/^=== stage: (\w+) ===$/);
    if (m) div.id = "log-stage-" + m[1];
    frag.appendChild(div);
    S.logLastEl = div;
  }
  logBodyEl.appendChild(frag);
  while (logBodyEl.children.length > 4000) logBodyEl.removeChild(logBodyEl.firstChild);
  if (logFollowCb.checked) scrollLogBottom();
}

};
const PHLD_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
  '<g fill="none" stroke="#9aa39d" stroke-width="3" stroke-linejoin="round" opacity="0.6">' +
  '<path d="M50 18 82 34 82 66 50 82 18 66 18 34Z"/><path d="M18 34 50 50 82 34M50 50 50 82"/></g></svg>');

function pct(n, d) { return d ? Math.round((n / d) * 100) : 0; }
function thumbImgHtml(aid, cls) {
  const a = (S.library && S.library.assets[aid]) || {};
  if (!a.thumb) return `<div class="phld ${cls || ""}"><img src="${PHLD_SVG}" style="width:46%;opacity:.9;border:none;background:none;"></div>`;
  return `<img class="${cls || ""}" src="/api/library/thumb/${encodeURIComponent(aid)}" loading="lazy" onerror="this.src='${PHLD_SVG}'">`;
}

async function fetchLibrary() {
  const el = document.getElementById("libView");
  if (!S.library) el.innerHTML = '<div class="empty">加载资产库统计…</div>';
  try {
    S.library = await api("/api/library/stats");
    renderLibrary();
  } catch (e) {
    el.innerHTML = `<div class="empty">统计加载失败: ${escapeHtml(e.message)}</div>`;
  }
}

function renderLibrary() {
  const s = S.library;
  const el = document.getElementById("libView");
  const k = s.kpis;
  S.drills = {};

  // --- KPI 行
  let html = `<div id="libHead">
    <h2>📦 资产库总览</h2>
    <span class="meta">catalog 更新于 ${fmtTime(s.catalog_mtime)} · 统计生成于 ${fmtTime(s.generated_at)}</span>
    <button id="libRefresh">刷新</button>
  </div>
  <div class="kpis">
    <div class="kpi"><div class="num">${k.assets}</div><div class="lbl">资产总数</div><div class="ctx">${k.model_variants} 个模型变体</div></div>
    <div class="kpi"><div class="num">${k.categories}</div><div class="lbl">类别</div><div class="ctx">${s.category_depth.singletons} 类仅 1 个资产</div></div>
    <div class="kpi"><div class="num">${k.available}</div><div class="lbl"><span class="kdot" style="background:var(--done);"></span>场景可用</div><div class="ctx">占 ${pct(k.available, k.assets)}%，其余待解锁</div></div>
    <div class="kpi"><div class="num">${k.imported}</div><div class="lbl"><span class="kdot" style="background:var(--cat-b);"></span>缺口引进</div><div class="ctx">占 ${pct(k.imported, k.assets)}%，随运行增长</div></div>
    <div class="kpi"><div class="num">${(s.retrieval.tiers.length || 1) - 1}+1</div><div class="lbl">检索梯队</div><div class="ctx">tier0 本地 + ${s.retrieval.tiers.length - 1} 级外部</div></div>
  </div>`;

  // --- 可用性 & 解锁清单
  const av = s.availability;
  const maxReason = av.reasons.length ? av.reasons[0].count : 1;
  html += `<div class="libcard">
    <h3>可用性 · 解锁清单</h3>
    <div class="sub">available = 可直接进入场景生成；未达标资产按缺失项归类，补齐即解锁</div>
    <div class="prop" title="可用 ${av.available} / ${av.total}">
      <span class="seg" style="width:${pct(av.available, av.total)}%;background:var(--done);"></span>
    </div>
    <div class="prop-lbl"><span><b style="color:var(--text);">${av.available} / ${av.total}</b> 可直接用于场景（${pct(av.available, av.total)}%）</span><span>缺失项可叠加，一个资产可能欠多项</span></div>
    <div style="margin-top:12px;">
      ${av.reasons.map(r => {
        S.drills["reason:" + r.reason] = {title: `缺 ${r.reason}（${REASON_LABELS[r.reason] || ""}）· ${r.count} 个资产`, ids: r.asset_ids};
        return `<div class="hbar-row" data-drill="reason:${escapeHtml(r.reason)}" title="点击查看具体资产">
          <span class="hl">${escapeHtml(r.reason)} <span style="color:var(--text-dim);">${REASON_LABELS[r.reason] || ""}</span></span>
          <span class="hbar-track"><span class="hbar-fill" style="width:${pct(r.count, maxReason)}%;"></span></span>
          <span class="hbar-val"><b>${r.count}</b> · 补齐解锁 ${r.count} 个</span>
        </div>`;
      }).join("")}
    </div>
  </div>`;

  // --- 来源 & 检索梯队
  const src = s.sources;
  const totalSrc = src.reduce((a, x) => a + x.count, 0);
  const srcColor = {robotwin_native: "var(--cat-a)", imported: "var(--cat-b)"};
  src.forEach(x => { S.drills["src:" + x.key] = {title: `${x.label} · ${x.count} 个资产`, ids: x.asset_ids}; });
  html += `<div class="libcard">
    <h3>来源构成</h3>
    <div class="sub">已入库的 ${totalSrc} 个资产从哪来 —— 场景生成只使用这些本地资产</div>
    <div class="prop">
      ${src.map(x => `<span class="seg" data-drill="src:${x.key}" style="width:${pct(x.count, totalSrc)}%;background:${srcColor[x.key]};cursor:pointer;" title="${escapeHtml(x.label)} ${x.count}"></span>`).join("")}
    </div>
    <div class="legend">
      ${src.map(x => `<span class="li" data-drill="src:${x.key}"><span class="ldot" style="background:${srcColor[x.key]};"></span>${escapeHtml(x.label)} <b>${x.count}</b>（${pct(x.count, totalSrc)}%）</span>`).join("")}
    </div>
  </div>
  <div class="libcard">
    <h3>检索梯队</h3>
    <div class="sub">缺口发生时按 tier 0→3 逐级向外检索的<b>外部候选池</b> —— 不计入本地资产数；候选通过下载、转换、质检后才落库成为「缺口引进」</div>
    <div class="tier-row">
      ${s.retrieval.tiers.map(t => `<div class="tier-card ${t.enabled ? "" : "off"}">
        <div class="tn">${t.tier}</div>
        <div class="tname">${t.providers.map(escapeHtml).join("<br>")}</div>
        <div class="tscale">${escapeHtml(t.scale || "")}${t.enabled ? "" : " · 未启用"}</div>
      </div>`).join("")}
    </div>
  </div>`;

  // --- 类别深度 + 标注覆盖（并排两卡）
  const depthLabels = {"1": "仅 1 个资产", "2": "2 个资产", "3+": "3 个及以上"};
  const maxDepth = Math.max(...s.category_depth.buckets.map(b => b.categories), 1);
  const ann = s.annotation;
  const annRows = [["materials", "材质"], ["colors", "颜色"], ["aliases", "别名"]];
  html += `<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px;">
  <div class="libcard" style="margin-bottom:0;">
    <h3>类别深度</h3>
    <div class="sub">每个类别有几个可选资产 —— 深度决定同类替换与选优空间</div>
    ${s.category_depth.buckets.map(b => `<div class="hbar-row" style="cursor:default;grid-template-columns:110px 1fr 60px;">
      <span>${depthLabels[b.depth] || b.depth}</span>
      <span class="hbar-track"><span class="hbar-fill" style="width:${pct(b.categories, maxDepth)}%;"></span></span>
      <span class="hbar-val"><b>${b.categories}</b> 类</span>
    </div>`).join("")}
    <div class="warnline">⚠ ${s.category_depth.singletons} 个类别只有 1 个资产 — 同类无备选</div>
    <div class="cat-chips">
      ${s.category_depth.top.filter(c => c.count > 1).map(c => {
        S.drills["cat:" + c.category] = {title: `类别 ${c.category} · ${c.count} 个资产`, ids: c.asset_ids};
        return `<span class="cat-chip" data-drill="cat:${escapeHtml(c.category)}">${escapeHtml(c.category)} <b>×${c.count}</b></span>`;
      }).join("")}
    </div>
  </div>
  <div class="libcard" style="margin-bottom:0;">
    <h3>语义标注覆盖</h3>
    <div class="sub">标注越全，检索命中与同类选优越准</div>
    ${annRows.map(([key, zh]) => `<div class="cov-row">
      <span>${zh} <span class="mono" style="color:var(--text-dim);font-size:11px;">${key}</span></span>
      <span class="cov-track"><span class="cov-fill" style="width:${pct(ann[key], ann.total)}%;"></span></span>
      <span class="cov-val"><b style="color:var(--text);">${ann[key]}</b> / ${ann.total} · ${pct(ann[key], ann.total)}%</span>
    </div>`).join("")}
    <div class="sub" style="margin:10px 0 0;">材质/颜色标注稀疏是当前检索质量的隐性瓶颈之一。</div>
  </div>
  </div>`;

  // --- 最近引进
  const imp = s.recent_imports;
  html += `<div class="libcard" style="margin-top:12px;">
    <h3>最近引进</h3>
    <div class="sub">缺口引进的资产按入库时间倒序；每次带「演示缺口」或真实缺口的运行都会让这里生长</div>
    ${imp.length ? `<div class="imp-strip">${imp.map(x => `
      <div class="imp-card" data-thumb="${escapeHtml(x.asset_id)}">
        ${thumbImgHtml(x.asset_id)}
        <div class="iid" title="${escapeHtml(x.asset_id)}">${escapeHtml(x.asset_id)}</div>
        <div class="icat">${escapeHtml(x.category || "")} · ${relTime(x.mtime)}</div>
      </div>`).join("")}</div>` : '<div class="empty">尚无引进记录</div>'}
  </div>
  <details class="raw" style="margin:0 4px 20px;"><summary>library stats 原始数据</summary><pre>${escapeHtml(JSON.stringify(s, null, 2))}</pre></details>`;

  el.innerHTML = html;

  el.querySelector("#libRefresh").onclick = () => fetchLibrary();
  el.querySelectorAll("[data-drill]").forEach(n => {
    n.addEventListener("click", () => openAssetDrill(n.dataset.drill));
  });
  el.querySelectorAll(".imp-card").forEach(n => {
    n.onclick = () => {
      const aid = n.dataset.thumb;
      if ((S.library.assets[aid] || {}).thumb) {
        S.lbList = [{url: `/api/library/thumb/${encodeURIComponent(aid)}`, cap: aid}];
        S.lbIdx = 0; showLb();
      }
    };
  });
}

function openAssetDrill(key) {
  const d = S.drills && S.drills[key];
  if (!d) return;
  const s = S.library;
  document.getElementById("modalTitle").textContent = d.title;
  document.getElementById("modalRaw").style.display = "none";
  const body = document.getElementById("modalBody");
  body.innerHTML = `<div class="drill-grid">${d.ids.map(aid => {
    const a = s.assets[aid] || {};
    return `<div class="drill-cell" data-aid="${escapeHtml(aid)}">
      ${thumbImgHtml(aid)}
      <div class="did" title="${escapeHtml(aid)}">${escapeHtml(aid)}</div>
      <div class="dmeta"><span class="dot ${a.available ? "scene" : "evidence"}"></span>${a.available ? "可用" : "待解锁"} · ${escapeHtml(a.load_type || "?")}${a.models > 1 ? " · " + a.models + " 变体" : ""}</div>
    </div>`;
  }).join("")}</div>`;
  document.getElementById("modal").classList.add("open");
  const imgs = [...body.querySelectorAll(".drill-cell img:not(.phld img)")].filter(i => !i.src.startsWith("data:"));
  body.querySelectorAll(".drill-cell").forEach(cell => {
    const img = cell.querySelector("img");
    if (!img || img.src.startsWith("data:")) return;
    img.onclick = () => {
      S.lbList = imgs.map(i => ({url: i.src, cap: i.closest(".drill-cell").dataset.aid}));
      S.lbIdx = Math.max(0, imgs.indexOf(img));
      showLb();
    };
  });
}

// ---------- view switching ----------
function setView(v) {
  S.view = v;
  document.querySelectorAll("#viewTabs .vtab").forEach(t => t.classList.toggle("active", t.dataset.v === v));
  const lib = v === "library";
  document.getElementById("libView").style.display = lib ? "" : "none";
  document.getElementById("welcome").style.display = (!lib && !S.id) ? "" : "none";
  document.getElementById("runView").style.display = (!lib && S.id) ? "" : "none";
  if (lib && !S.library) fetchLibrary();
}
window.addEventListener("hashchange", () => setView(location.hash === "#library" ? "library" : "run"));
document.querySelectorAll("#viewTabs .vtab").forEach(t => {
  t.onclick = () => { location.hash = t.dataset.v === "library" ? "#library" : ""; };
});
document.getElementById("libEntry").onclick = () => { location.hash = "#library"; };

// ---------- boot ----------
refreshRuns();
setInterval(refreshRuns, 5000);
setView(location.hash === "#library" ? "library" : "run");
</script>
</body>
</html>
