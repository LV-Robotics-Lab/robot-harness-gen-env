[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robot-harness-gen-env"
version = "0.1.0"
description = "Deterministic text-to-RoboTwin scene compilation and physical validation"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "LV Robotics Lab"}]
dependencies = [
  "imageio>=2.34,<3",
  "numpy>=1.26,<3",
  "pydantic>=2.9,<3",
  "PyYAML>=6,<7",
  "Pillow>=10,<12",
]

[project.scripts]
self-improving-audit = "self_improving.__main__:main"
robot-harness-compile = "self_improving.harness.compile_cli:main"
robot-harness-run-qualified-replay = "self_improving.qualified_replay_cli:main"

[project.optional-dependencies]
demo = ["Flask>=3.0,<4"]
vlm = [
  "accelerate>=1.2,<2",
  "qwen-vl-utils>=0.0.8,<0.1",
  "transformers>=4.49,<5",
]
dev = ["pytest>=8.3,<9", "pytest-cov>=6,<8", "ruff>=0.9,<1"]
platform = [
  "jsonschema>=4.23,<5",
  "numpy>=1.26,<3",
  "trimesh>=4.5,<5",
]

[tool.setuptools.packages.find]
include = [
  "scene_gen*",
  "demo*",
  "self_improving",
  "self_improving.harness*",
  "self_improving.asset_pipeline.active.asset_reuse.lib*",
]

[tool.setuptools.package-data]
scene_gen = ["AGENTS.md", "asset_overrides.yml", "envs/AGENTS.md", "prompts/*.md"]
"self_improving.harness" = [
  "IMPLEMENTATION_LOG.md",
  "json_schemas/*.json",
  "native/*.c",
  "qualified_skills/**/*.json",
]
self_improving = ["asset_pipeline/active/asset_reuse/lib/README.md"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
